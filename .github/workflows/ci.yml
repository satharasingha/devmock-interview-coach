name: CI/CD Pipeline for DevMock

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Backend Testing Job
  backend-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend
    
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      
      - name: Install backend dependencies
        run: npm ci
      
      - name: Run backend linting (ESLint)
        run: npm run lint || echo "No lint script configured"
      
      - name: Run backend tests (Jest)
        run: npm test || echo "No test script configured"
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret
          MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
      
      - name: Check TypeScript types (if using TypeScript)
        run: npx tsc --noEmit || echo "No TypeScript config found"

  # Frontend Testing Job
  frontend-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install frontend dependencies
        run: npm ci
      
      - name: Run frontend linting
        run: npm run lint || echo "No lint script configured"
      
      - name: Run frontend tests (Vitest/Jest)
        run: npm test -- --passWithNoTests || echo "No test script configured"
      
      - name: Build frontend (Vite/React)
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000/api

  # Integration Test (Optional)
  integration-test:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install all dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci
      
      - name: Start backend server
        run: |
          cd backend
          npm start &
          sleep 5
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret
          MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
      
      - name: Run API tests with Postman/Newman
        run: |
          npm install -g newman
          newman run tests/api-collection.json
        continue-on-error: true
